<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f0c29" />
<title>📚 EduTrack Pro — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
  --primary:#302b63;--accent:#fcdc04;
  --surface:#fff;--surface-2:#f8f9fa;--surface-3:#f0f4ff;
  --text:#1a1a2e;--text-2:#555;--text-3:#888;--border:#e0e0e0;
  --success:#1a8a4a;--danger:#c1121f;--warning:#e85d04;--info:#004085;
  --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --shadow-md:0 4px 15px rgba(0,0,0,.08);
  --shadow-lg:0 10px 30px rgba(0,0,0,.15);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);min-height:100vh;padding:14px;display:flex;align-items:center;justify-content:center;color:var(--text)}
@media(min-width:640px){body{padding:24px}}

.auth-wrapper{width:100%;max-width:560px;position:relative}
.auth-card{background:rgba(255,255,255,.98);border-radius:var(--radius-lg);padding:24px 20px 28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
@media(min-width:640px){.auth-card{padding:30px 30px 34px}}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#000 0%,#000 33%,var(--accent) 33%,var(--accent) 66%,#d90000 66%,#d90000 100%)}

.auth-header{text-align:center;margin-bottom:18px}
.auth-header .logo{font-size:50px;line-height:1;display:block;margin-bottom:6px}
.auth-header h1{font-family:Georgia,serif;color:var(--primary);font-size:26px;font-weight:700;margin-bottom:3px;background:linear-gradient(135deg,var(--bg1),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-header .subtitle{color:var(--text-3);font-size:13px}
.conn-status{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;margin-top:10px}
.conn-status .dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block;flex-shrink:0}
.conn-status.checking{background:#fff3cd;color:#856404}
.conn-status.checking .dot{background:var(--warning);animation:pulse 1s infinite}
.conn-status.connected{background:#d4edda;color:#155724}
.conn-status.connected .dot{background:var(--success)}
.conn-status.disconnected{background:#f8d7da;color:#721c24}
.conn-status.disconnected .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.role-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--surface-2);padding:5px;border-radius:12px;margin-bottom:16px}
@media(max-width:420px){.role-toggle{grid-template-columns:repeat(2,1fr)}}
.role-btn{padding:10px 6px;border:none;border-radius:8px;background:none;font-weight:700;font-size:11px;color:#666;cursor:pointer;transition:.2s;white-space:nowrap;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center}
@media(min-width:640px){.role-btn{font-size:12px;min-height:60px}}
.role-btn .role-emoji{font-size:18px;line-height:1}
.role-btn.active{background:linear-gradient(135deg,var(--bg1),var(--primary));color:#fff;box-shadow:0 4px 12px rgba(48,43,99,.35)}
.role-btn:not(.active):hover{background:rgba(48,43,99,.08);color:var(--primary)}

.mode-toggle{text-align:center;margin-bottom:16px;font-size:13px}
.mode-link{background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-3);padding:6px 10px;font-family:inherit}
.mode-link.active{color:var(--primary);text-decoration:underline}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;color:var(--text-2);font-size:13px;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:10px;font-size:16px;background:#fafafa;transition:.2s;font-family:inherit;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(48,43,99,.15);background:#fff}
.form-row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.form-row{grid-template-columns:1fr 1fr}}
.pass-wrap{position:relative}
.pass-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#888;font-size:15px;cursor:pointer;padding:6px}

.btn{padding:14px 24px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit;min-height:50px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--bg1),var(--primary));color:#fff}
.btn-success{background:linear-gradient(135deg,var(--success),#2d6a4f);color:#fff}
.btn-primary:hover:not(:disabled),.btn-success:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18)}

hr{border:none;border-top:1px dashed var(--border);margin:18px 0}

.status-msg{padding:12px 15px;border-radius:10px;margin-top:12px;font-size:13px;display:none;line-height:1.5;border-left:4px solid}
.status-msg.success{display:block;background:#d4edda;color:#155724;border-color:var(--success)}
.status-msg.error{display:block;background:#f8d7da;color:#721c24;border-color:var(--danger)}
.status-msg.info{display:block;background:#d1ecf1;color:#0c5460;border-color:var(--info)}
.status-msg.warning{display:block;background:#fff3cd;color:#856404;border-color:var(--warning)}

.toast-notification{position:fixed;top:16px;right:16px;left:16px;padding:14px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:9999;opacity:0;transform:translateY(-20px);transition:all .3s;font-size:14px;box-shadow:var(--shadow-lg);text-align:center;max-width:400px}
@media(min-width:640px){.toast-notification{left:auto;transform:translateX(120%)}}
.toast-notification.show{opacity:1;transform:translateY(0)}
@media(min-width:640px){.toast-notification.show{transform:translateX(0)}}
.toast-notification.success{background:linear-gradient(135deg,var(--success),#2d6a4f)}
.toast-notification.error{background:linear-gradient(135deg,var(--danger),#780000)}
.toast-notification.info{background:linear-gradient(135deg,var(--bg1),var(--primary))}
.toast-notification.warning{background:linear-gradient(135deg,var(--warning),#dc2f02)}

.footer-note{text-align:center;font-size:11px;color:var(--text-3);margin-top:16px;line-height:1.6}
</style>
</head>
<body>

<div id="toastContainer"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo">📚</span>
      <h1>EduTrack Pro</h1>
      <p class="subtitle" id="authSubtitle">Please sign in to continue</p>
      <span id="connectionStatus" class="conn-status checking"><span class="dot"></span> Checking connection…</span>
    </div>

    <div class="role-toggle">
      <button type="button" class="role-btn active" id="roleBtnAdmin"       onclick="setAuthRole('admin')"><span class="role-emoji">👨‍💼</span>Admin</button>
      <button type="button" class="role-btn"        id="roleBtnBursar"      onclick="setAuthRole('bursar')"><span class="role-emoji">💰</span>Bursar</button>
      <button type="button" class="role-btn"        id="roleBtnGateman"     onclick="setAuthRole('gateman')"><span class="role-emoji">🚪</span>Gate</button>
      <button type="button" class="role-btn"        id="roleBtnTeacher"     onclick="setAuthRole('teacher')"><span class="role-emoji">👩‍🏫</span>Teacher</button>
      <button type="button" class="role-btn"        id="roleBtnParent"      onclick="setAuthRole('parent')"><span class="role-emoji">👨‍👩‍👦</span>Parent</button>
      <button type="button" class="role-btn"        id="roleBtnStudent"     onclick="setAuthRole('student')"><span class="role-emoji">🎓</span>Student</button>
      <button type="button" class="role-btn"        id="roleBtnNurse"       onclick="setAuthRole('nurse')"><span class="role-emoji">🏥</span>Nurse</button>
      <button type="button" class="role-btn"        id="roleBtnStorekeeper" onclick="setAuthRole('storekeeper')"><span class="role-emoji">📦</span>Store</button>
    </div>

    <div class="mode-toggle" id="authModeToggle">
      <button type="button" class="mode-link active" id="modeBtnLogin" onclick="setAuthMode('login')">Login</button>
      <span style="color:#ccc">|</span>
      <button type="button" class="mode-link" id="modeBtnSignup" onclick="setAuthMode('signup')">Create School Account</button>
    </div>

    <div id="loginFields">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="authUsername" placeholder="Enter your username" autocomplete="username"
          onchange="if(pendingAuthRole==='parent') loadParentChildren()"
          onblur="if(pendingAuthRole==='parent') loadParentChildren()" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pass-wrap">
          <input type="password" id="authPassword" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="pass-toggle" onclick="togglePassword('authPassword',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group" id="authSchoolGroup">
        <label>School</label>
        <select id="authSchoolSelect" onchange="if(pendingAuthRole==='parent') loadParentChildren()">
          <option value="">Select your school</option>
        </select>
      </div>
      <div class="form-group" id="authChildGroup" style="display:none">
        <label>Select Child</label>
        <select id="authChildSelect"><option value="">Select your child</option></select>
      </div>
      <button class="btn btn-primary" id="authLoginBtn" onclick="attemptLogin()">🔓 Login</button>
      <p class="footer-note">Contact admin for your login credentials.</p>
    </div>

    <div id="signupFields" style="display:none">
      <div class="form-group"><label>Full Name *</label><input type="text" id="signupName" autocomplete="name" /></div>
      <div class="form-group"><label>Username *</label><input type="text" id="signupUsername" autocomplete="username" /></div>
      <div class="form-group">
        <label>Password *</label>
        <div class="pass-wrap">
          <input type="password" id="signupPassword" autocomplete="new-password" />
          <button type="button" class="pass-toggle" onclick="togglePassword('signupPassword',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <div class="pass-wrap">
          <input type="password" id="signupPasswordConfirm" autocomplete="new-password" />
          <button type="button" class="pass-toggle" onclick="togglePassword('signupPasswordConfirm',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <hr>
      <p style="color:var(--primary);font-weight:700;font-size:14px;margin-bottom:12px">🏫 School Details</p>
      <div class="form-group"><label>School Name *</label><input type="text" id="signupSchoolName" /></div>
      <div class="form-row">
        <div class="form-group"><label>Phone *</label><input type="tel" id="signupSchoolPhone" /></div>
        <div class="form-group"><label>Email *</label><input type="email" id="signupSchoolEmail" /></div>
      </div>
      <div class="form-group"><label>Address</label><input type="text" id="signupSchoolAddress" /></div>
      <div class="form-group"><label>Motto</label><input type="text" id="signupSchoolMotto" /></div>
      <button class="btn btn-success" id="authSignupBtn" onclick="attemptAdminSignup()">✅ Create School Account</button>
    </div>

    <div id="authStatus" class="status-msg"></div>
  </div>
</div>

<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8LoQcAlViMcFQLvvJYMdjZT00Ha8YHqeV91ibXFGB2BQnHrVgyU-0psvDdyhwUcrSKA/exec';
var ACCOUNTS_SHEET_ID = '1OmV8zDm_KfwdHs3KQcvdpeIiJimLUa3KxltXcPcZjaQ';

var ROLE_HOME = {
  admin:'admin.html', bursar:'bursar.html', gateman:'gate.html',
  teacher:'teacher.html', parent:'parent.html', student:'student.html',
  nurse:'nurse.html', storekeeper:'store.html'
};

var pendingAuthRole = 'admin';
var pendingAuthMode = 'login';
var isConnected = false;

function showToast(msg, type){
  type = type || 'info';
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast-notification ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('show'); }, 30);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 400); }, 3600);
}

function showAuthStatus(msg, type){
  var el = document.getElementById('authStatus');
  el.style.display = 'block';
  el.className = 'status-msg ' + (type || 'info');
  el.textContent = msg;
}

function togglePassword(id, btn){
  var inp = document.getElementById(id);
  if(!inp) return;
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
}

async function callAppsScript(params){
  var parts = [];
  for(var k in params){
    if(params.hasOwnProperty(k) && params[k] !== undefined && params[k] !== null){
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
  }
  var res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
    body: parts.join('&'),
    signal: AbortSignal.timeout(30000)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

function setAuthRole(role){
  pendingAuthRole = role;
  document.querySelectorAll('.role-btn').forEach(function(el){ el.classList.remove('active'); });
  var btn = document.getElementById('roleBtn' + role.charAt(0).toUpperCase() + role.slice(1));
  if(btn) btn.classList.add('active');
  var mode = document.getElementById('authModeToggle');
  var cg = document.getElementById('authChildGroup');
  if(mode) mode.style.display = (role === 'admin') ? 'block' : 'none';
  if(cg){
    cg.style.display = (role === 'parent') ? 'block' : 'none';
    if(role === 'parent') loadParentChildren();
  }
  setAuthMode(role !== 'admin' ? 'login' : pendingAuthMode);
  if(role === 'admin') loadSchoolsForLogin();
}

function setAuthMode(mode){
  pendingAuthMode = mode;
  document.getElementById('modeBtnLogin').classList.toggle('active', mode === 'login');
  document.getElementById('modeBtnSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('loginFields').style.display = (mode === 'login') ? 'block' : 'none';
  document.getElementById('signupFields').style.display = (mode === 'signup') ? 'block' : 'none';
  document.getElementById('authStatus').style.display = 'none';
  if(mode === 'login') loadSchoolsForLogin();
}

async function testConnection(){
  var s = document.getElementById('connectionStatus');
  s.className = 'conn-status checking';
  s.innerHTML = '<span class="dot"></span> Testing…';
  try{
    var r = await callAppsScript({ action: 'ping' });
    if(r && r.success){
      isConnected = true;
      s.className = 'conn-status connected';
      s.innerHTML = '<span class="dot"></span> Connected';
      await loadSchoolsForLogin();
      return true;
    }
    s.className = 'conn-status disconnected';
    s.innerHTML = '<span class="dot"></span> Error';
    return false;
  } catch(e){
    console.error('Connection test failed:', e);
    isConnected = false;
    s.className = 'conn-status disconnected';
    s.innerHTML = '<span class="dot"></span> Offline';
    return false;
  }
}

async function loadSchoolsForLogin(){
  if(!isConnected){ var ok = await testConnection(); if(!ok) return; }
  try{
    var r = await callAppsScript({
      action: 'getAllAccounts',
      sheetId: ACCOUNTS_SHEET_ID,
      school: ''
    });
    var select = document.getElementById('authSchoolSelect');
    if(!select) return;
    select.innerHTML = '<option value="">Select your school</option>';
    if(r && r.success && r.data && Array.isArray(r.data.accounts)){
      var schools = [];
      r.data.accounts.forEach(function(a){
        var s = String(a.school || '').trim();
        if(s && schools.indexOf(s) === -1) schools.push(s);
      });
      schools.sort();
      schools.forEach(function(sc){
        var o = document.createElement('option');
        o.value = sc; o.textContent = sc;
        select.appendChild(o);
      });
    }
  } catch(e){ console.warn('loadSchoolsForLogin error:', e); }
}

async function loadParentChildren(){
  try{
    if(!isConnected){ var ok = await testConnection(); if(!ok) return; }
    var username = document.getElementById('authUsername')?.value?.trim() || '';
    var school = document.getElementById('authSchoolSelect')?.value || '';
    if(!username || !school) return;
    var r = await callAppsScript({
      action: 'getParentChildren',
      sheetId: ACCOUNTS_SHEET_ID,
      school: school, username: username
    });
    var select = document.getElementById('authChildSelect');
    if(select && r && r.success && r.data){
      select.innerHTML = '<option value="">Select your child</option>';
      (r.data.children || []).forEach(function(c){
        var o = document.createElement('option');
        o.value = c.studentId;
        o.textContent = c.studentName + ' (' + c.class + ')';
        select.appendChild(o);
      });
    }
  } catch(e){}
}

async function attemptLogin(){
  if(!isConnected) await testConnection();

  var username = document.getElementById('authUsername').value.trim();
  var password = document.getElementById('authPassword').value;
  var school = document.getElementById('authSchoolSelect').value;
  var childId = document.getElementById('authChildSelect').value;

  if(!username || !password){ showAuthStatus('Enter username and password.', 'error'); return; }
  if(!school){ showAuthStatus('Select a school.', 'error'); return; }
  if(pendingAuthRole === 'parent' && !childId){ showAuthStatus('Select your child.', 'error'); return; }

  var btn = document.getElementById('authLoginBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Signing in…';

  try{
    var r = await callAppsScript({
      action: 'login',
      sheetId: ACCOUNTS_SHEET_ID,
      username: username, password: password, school: school
    });
    btn.disabled = false; btn.innerHTML = '🔓 Login';

    if(r && r.success && r.data && r.data.user){
      var u = r.data.user;
      var backendRole = String(u.role || '').toLowerCase();
      if(backendRole && backendRole !== pendingAuthRole &&
         !(pendingAuthRole === 'admin' && backendRole === 'superadmin')){
        showAuthStatus(
          '❌ This account is registered as "' + backendRole +
          '", not "' + pendingAuthRole + '". Select the correct role.',
          'error'
        );
        return;
      }

      var session = u;
      session.school = school || session.school;
      if(pendingAuthRole === 'parent') session.childId = childId;
      sessionStorage.setItem('authSession', JSON.stringify(session));
      showToast('✅ Welcome back, ' + (u.name || u.username) + '!', 'success');

      var home = ROLE_HOME[backendRole || pendingAuthRole] || 'admin.html';
      setTimeout(function(){ window.location.href = home; }, 400);
    } else {
      showAuthStatus('❌ ' + ((r && r.message) || 'Invalid username, password, or school.'), 'error');
    }
  } catch(e){
    btn.disabled = false; btn.innerHTML = '🔓 Login';
    showAuthStatus('⚠️ Server error: ' + e.message, 'warning');
  }
}

async function attemptAdminSignup(){
  if(!isConnected) await testConnection();

  var name = document.getElementById('signupName').value.trim();
  var username = document.getElementById('signupUsername').value.trim();
  var password = document.getElementById('signupPassword').value;
  var confirm = document.getElementById('signupPasswordConfirm').value;
  var schoolName = document.getElementById('signupSchoolName').value.trim();
  var phone = document.getElementById('signupSchoolPhone').value.trim();
  var email = document.getElementById('signupSchoolEmail').value.trim();
  var address = document.getElementById('signupSchoolAddress').value.trim();
  var motto = document.getElementById('signupSchoolMotto').value.trim();

  if(!name || !username || password.length < 6 || password !== confirm || !schoolName || !phone || !email){
    showAuthStatus('Fill all required fields correctly (password ≥ 6 chars).', 'error'); return;
  }
  var btn = document.getElementById('authSignupBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Creating…';

  try{
    var r = await callAppsScript({
      action: 'createSchoolAccount',
      sheetId: ACCOUNTS_SHEET_ID,
      name: name, username: username, password: password,
      schoolName: schoolName, schoolPhone: phone, schoolEmail: email,
      schoolAddress: address, schoolMotto: motto
    });
    btn.disabled = false; btn.innerHTML = '✅ Create School Account';

    if(r && r.success){
      var session = (r.data && r.data.user) || {
        name: name, username: username, role: 'admin', school: schoolName
      };
      session.school = schoolName;
      sessionStorage.setItem('authSession', JSON.stringify(session));
      showToast('✅ School account created!', 'success');
      setTimeout(function(){ window.location.href = 'admin.html'; }, 500);
    } else {
      showAuthStatus('❌ ' + ((r && r.message) || 'Signup failed.'), 'error');
    }
  } catch(e){
    btn.disabled = false; btn.innerHTML = '✅ Create School Account';
    showAuthStatus('⚠️ ' + e.message, 'warning');
  }
}

document.addEventListener('DOMContentLoaded', function(){
  var existing = sessionStorage.getItem('authSession');
  if(existing){
    try{
      var s = JSON.parse(existing);
      if(s && s.role){
        window.location.href = ROLE_HOME[String(s.role).toLowerCase()] || 'admin.html';
        return;
      }
    } catch(e){}
  }
  setAuthRole('admin');
  setAuthMode('login');
  setTimeout(testConnection, 400);
});
/**
 * ============================================================
 * EduTrack Pro — Backend v20.0
 * ------------------------------------------------------------
 * Accounts tab is the SINGLE source of truth.
 * Canonical header (fixed order):
 *   School | Name | Username | Password | Role | Child ID |
 *   Staff ID | Phone | Email | Qualifications |
 *   Salary | Other Roles | Assignments |
 *   Created At | Updated At
 * ============================================================
 */

var MASTER_SHEET_ID    = '1OmV8zDm_KfwdHs3KQcvdpeIiJimLUa3KxltXcPcZjaQ';
var ACCOUNTS_SHEET_ID  = '1OmV8zDm_KfwdHs3KQcvdpeIiJimLUa3KxltXcPcZjaQ';
var ACCOUNTS_TAB_NAME  = 'Accounts';

var ACCOUNTS_HDR = [
  'School','Name','Username','Password','Role','Child ID',
  'Staff ID','Phone','Email','Qualifications',
  'Salary','Other Roles','Assignments',
  'Created At','Updated At'
];
var ACC = {
  SCHOOL:0, NAME:1, USERNAME:2, PASSWORD:3, ROLE:4,
  CHILD_ID:5, STAFF_ID:6, PHONE:7, EMAIL:8,
  QUALIFICATIONS:9, SALARY:10, OTHER_ROLES:11,
  ASSIGNMENTS:12, CREATED_AT:13, UPDATED_AT:14
};

var SHEETS = {
  FEES:'FeeRecords', EXPENSES:'Expenses',
  ATTENDANCE:'AttendanceMaster', NURSE:'NurseRecords',
  STORES:'StoreRecords', CHAT:'ChatMessages', GATE:'GateLogs',
  SETTINGS:'SchoolSettings', CLASS_LINKS:'SchoolClassLinks'
};

/* ---------------- ROUTER ---------------- */
function doPost(e){ return handle(e); }
function doGet(e){  return handle(e); }

function handle(e){
  try{
    var p = parseParams(e);
    if(!p.action) return out({success:false, message:'No action'});
    return out(route(p.action, p));
  }catch(err){
    return out({success:false, message:'Server error: ' + err.message});
  }
}
function out(o){
  return ContentService.createTextOutput(JSON.stringify(o))
    .setMimeType(ContentService.MimeType.JSON);
}
function parseParams(e){
  var p = {};
  if(e && e.postData && e.postData.contents){
    e.postData.contents.split('&').forEach(function(kv){
      var x = kv.split('=');
      if(x.length === 2){
        p[decodeURIComponent(x[0])] = decodeURIComponent(x[1].replace(/\+/g,' '));
      }
    });
  }
  if(e && e.parameter){
    for(var k in e.parameter){ if(!p[k]) p[k] = e.parameter[k]; }
  }
  return p;
}

function route(a, p){
  switch(a){
    case 'ping':                 return {success:true,data:{time:new Date().toISOString()}};

    /* Accounts */
    case 'login':                return login(p);
    case 'createUserAccount':    return createUserAccount(p);
    case 'createSchoolAccount':  return createSchoolAccount(p);
    case 'getAllAccounts':       return getAllAccounts(p);
    case 'getTeacherAccount':    return getTeacherAccount(p);
    case 'updateTeacherProfile': return updateTeacherProfile(p);
    case 'deleteAccount':        return deleteAccount(p);
    case 'getParentChildren':    return getParentChildren(p);

    /* Class links */
    case 'saveClassLink':        return saveClassLink(p);
    case 'getClassLinks':        return getClassLinks(p);

    /* Students */
    case 'getStudentCount':      return getStudentCount(p);
    case 'getStudents':          return getStudents(p);
    case 'registerStudent':      return registerStudent(p);
    case 'getNextStudentId':     return getNextStudentId(p);
    case 'getAllData':           return getAllData(p);
    case 'debugClass':           return debugClass(p);
    case 'postScoresOnly':       return postScoresOnly(p);

    /* Attendance */
    case 'getManualAttendance':  return getManualAttendance(p);
    case 'saveManualAttendance': return saveManualAttendance(p);
    case 'saveAttendance':       return saveAttendance(p);
    case 'getAttendanceDays':    return getAttendanceDays(p);

    /* Finance */
    case 'getFeeRecords':        return getFeeRecords(p);
    case 'saveFeeRecord':        return saveFeeRecord(p);
    case 'getFeeBalance':        return getFeeBalance(p);
    case 'getExpenses':          return getExpenses(p);
    case 'saveExpense':          return saveExpense(p);

    /* Chat / Nurse / Stores */
    case 'getChatUsers':         return getChatUsers(p);
    case 'getChatMessages':      return getChatMessages(p);
    case 'saveChatMessage':      return saveChatMessage(p);
    case 'getNurseSummary':      return getNurseSummary(p);
    case 'saveNurseRecord':      return saveNurseRecord(p);
    case 'getStoresSummary':     return getStoresSummary(p);
    case 'saveStoreRecord':      return saveStoreRecord(p);

    /* Settings */
    case 'getSchoolSettings':    return getSchoolSettings(p);
    case 'saveSchoolSettings':   return saveSchoolSettings(p);

    /* Debug */
    case 'debugAccounts':        return debugAccounts(p);

    default: return {success:false, message:'Unknown action: ' + a};
  }
}

/* ---------------- HELPERS ---------------- */
function openSS(id){ return SpreadsheetApp.openById(id); }
function safeParse(o){
  if(o === undefined || o === null || o === '') return null;
  if(typeof o === 'object') return o;
  try{ return JSON.parse(o); }catch(e){ return null; }
}
function parseJSONArray(s){
  var x = safeParse(s); return Array.isArray(x) ? x : [];
}
function masterSheet(name){
  var ss = openSS(MASTER_SHEET_ID);
  var sh = ss.getSheetByName(name);
  if(!sh){ sh = ss.insertSheet(name); sh.appendRow(['created_at']); }
  return sh;
}
function ensureHdr(sh, hdr){
  if(sh.getLastRow() === 0){
    sh.appendRow(hdr);
    sh.getRange(1,1,1,hdr.length).setFontWeight('bold')
      .setBackground('#302b63').setFontColor('#ffffff');
    sh.setFrozenRows(1);
    return;
  }
  var lastCol = Math.max(sh.getLastColumn(),1);
  var row1 = sh.getRange(1,1,1,lastCol).getValues()[0]
               .map(function(x){ return String(x).trim(); });
  var add = [];
  hdr.forEach(function(h){ if(row1.indexOf(h)<0) add.push(h); });
  if(add.length){
    var c = lastCol + 1;
    add.forEach(function(h,i){
      sh.getRange(1,c+i).setValue(h).setFontWeight('bold')
        .setBackground('#302b63').setFontColor('#ffffff');
    });
  }
}
function appendObj(sh, hdr, obj){
  ensureHdr(sh, hdr);
  var row = hdr.map(function(h){
    var v = obj[h];
    return (v === undefined || v === null) ? '' : v;
  });
  sh.appendRow(row);
  return sh.getLastRow();
}

/* ---------------- ACCOUNTS ---------------- */
function accountsSheet(p){
  var id = (p && p.sheetId) ? String(p.sheetId).trim() : ACCOUNTS_SHEET_ID;
  var ss = openSS(id);
  var sh = ss.getSheetByName(ACCOUNTS_TAB_NAME);
  if(!sh) sh = ss.insertSheet(ACCOUNTS_TAB_NAME);
  return sh;
}
function enforceAccountsHeader(sh){
  var lastCol = Math.max(sh.getLastColumn(),1);
  var row1 = sh.getRange(1,1,1,lastCol).getValues()[0]
               .map(function(x){ return String(x).trim(); });
  var exact = (row1.length === ACCOUNTS_HDR.length);
  if(exact){
    for(var i=0;i<ACCOUNTS_HDR.length;i++){
      if(row1[i] !== ACCOUNTS_HDR[i]){ exact = false; break; }
    }
  }
  if(exact) return;
  sh.getRange(1,1,1,ACCOUNTS_HDR.length).setValues([ACCOUNTS_HDR]);
  sh.getRange(1,1,1,ACCOUNTS_HDR.length).setFontWeight('bold')
    .setBackground('#302b63').setFontColor('#ffffff');
  sh.setFrozenRows(1);
}
function buildAccountRow(v){
  return [
    v.school||'', v.name||'', v.username||'', v.password||'',
    v.role||'teacher', v.childId||'', v.staffId||'',
    v.phone||'', v.email||'', v.qualifications||'',
    parseFloat(v.salary)||0,
    JSON.stringify(parseJSONArray(v.otherRoles)),
    JSON.stringify(parseJSONArray(v.assignments)),
    new Date().toISOString(),
    new Date().toISOString()
  ];
}
function rowToAccount(r){
  return {
    school:        String(r[ACC.SCHOOL]||''),
    name:          String(r[ACC.NAME]||''),
    username:      String(r[ACC.USERNAME]||''),
    role:          String(r[ACC.ROLE]||'teacher').toLowerCase(),
    childId:       String(r[ACC.CHILD_ID]||''),
    staffId:       String(r[ACC.STAFF_ID]||''),
    phone:         String(r[ACC.PHONE]||''),
    email:         String(r[ACC.EMAIL]||''),
    qualifications:String(r[ACC.QUALIFICATIONS]||''),
    salary:        parseFloat(r[ACC.SALARY])||0,
    otherRoles:    parseJSONArray(r[ACC.OTHER_ROLES]),
    assignments:   parseJSONArray(r[ACC.ASSIGNMENTS])
  };
}

/* ---- login ---- */
function login(p){
  if(!p.username || !p.password)
    return {success:false, message:'Missing credentials'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:false, message:'Invalid credentials'};

    var inUser   = String(p.username).trim().toLowerCase();
    var inPass   = String(p.password).trim();
    var inSchool = String(p.school || '').trim().toLowerCase();

    for(var i=1;i<d.length;i++){
      var r = d[i];
      var rowUser   = String(r[ACC.USERNAME]||'').trim().toLowerCase();
      var rowPass   = String(r[ACC.PASSWORD]||'').trim();
      var rowSchool = String(r[ACC.SCHOOL]||'').trim().toLowerCase();

      if(rowUser !== inUser) continue;
      if(rowPass !== inPass) continue;
      if(inSchool && rowSchool !== inSchool) continue;

      var a = rowToAccount(r);
      return {success:true, data:{user:{
        school: a.school, name: a.name, username: a.username,
        role: a.role, childId: a.childId, staffId: a.staffId,
        phone: a.phone, email: a.email, qualifications: a.qualifications,
        salary: a.salary,
        otherRoles:  JSON.stringify(a.otherRoles),
        assignments: JSON.stringify(a.assignments)
      }}};
    }
    return {success:false, message:'Invalid credentials'};
  }catch(e){
    return {success:false, message:e.message};
  }
}

/* ---- createUserAccount (admin panel) ---- */
function createUserAccount(p){
  if(!p.school || !p.name || !p.username || !p.password)
    return {success:false, message:'Missing required fields'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);

    var d = sh.getDataRange().getValues();
    if(d.length > 1){
      var target = String(p.username).trim().toLowerCase();
      for(var i=1;i<d.length;i++){
        var u = String(d[i][ACC.USERNAME]||'').trim().toLowerCase();
        var s = String(d[i][ACC.SCHOOL]||'').trim();
        if(u === target && (!p.school || s.toLowerCase() === String(p.school).toLowerCase())){
          return {success:false, message:'Username already exists'};
        }
      }
    }

    sh.appendRow(buildAccountRow(p));

    return {success:true, data:{
      username: p.username,
      staffId:  p.staffId||'',
      sheetId:  (p.sheetId || ACCOUNTS_SHEET_ID),
      sheetTab: sh.getName(),
      row:      sh.getLastRow()
    }};
  }catch(e){
    return {success:false, message:'createUserAccount error: ' + e.message};
  }
}

/* ---- createSchoolAccount (from index.html signup) ---- */
function createSchoolAccount(p){
  if(!p.schoolName || !p.name || !p.username || !p.password)
    return {success:false, message:'Missing required fields'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);

    var d = sh.getDataRange().getValues();
    if(d.length > 1){
      var target = String(p.username).trim().toLowerCase();
      for(var i=1;i<d.length;i++){
        var u = String(d[i][ACC.USERNAME]||'').trim().toLowerCase();
        if(u === target) return {success:false, message:'Username already exists'};
      }
    }

    var record = {
      school:        p.schoolName,
      name:          p.name,
      username:      p.username,
      password:      p.password,
      role:          'admin',
      childId:       '',
      staffId:       'ADM-' + Math.floor(1000 + Math.random()*9000),
      phone:         p.schoolPhone || '',
      email:         p.schoolEmail || '',
      qualifications:'',
      salary:        0,
      otherRoles:    '[]',
      assignments:   '[]'
    };
    sh.appendRow(buildAccountRow(record));

    /* Also persist school settings */
    try{
      saveSchoolSettings({
        school: p.schoolName,
        settings: JSON.stringify({
          schoolName: p.schoolName,
          schoolPhone: p.schoolPhone || '',
          schoolEmail: p.schoolEmail || '',
          schoolAddress: p.schoolAddress || '',
          schoolMotto: p.schoolMotto || '',
          currentTerm: 'I',
          currentYear: String(new Date().getFullYear())
        })
      });
    }catch(e2){}

    return {success:true, data:{user:{
      school: p.schoolName,
      name: p.name,
      username: p.username,
      role: 'admin',
      staffId: record.staffId,
      phone: record.phone,
      email: record.email,
      salary: 0,
      otherRoles: '[]',
      assignments: '[]'
    }}};
  }catch(e){
    return {success:false, message:'createSchoolAccount error: ' + e.message};
  }
}

/* ---- getAllAccounts ---- */
function getAllAccounts(p){
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:true, data:{accounts:[]}};

    var acc = [];
    for(var i=1;i<d.length;i++){
      var r = d[i];
      if(p.school && String(r[ACC.SCHOOL]||'').toLowerCase() !== String(p.school).toLowerCase()) continue;
      var a = rowToAccount(r);
      a.otherRoles  = JSON.stringify(a.otherRoles);
      a.assignments = JSON.stringify(a.assignments);
      acc.push(a);
    }
    return {success:true, data:{accounts:acc}};
  }catch(e){
    return {success:false, message:e.message};
  }
}

/* ---- getTeacherAccount (used by teacher.html) ---- */
function getTeacherAccount(p){
  if(!p.username) return {success:false, message:'username required'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:true, data:{account:null}};

    var inUser   = String(p.username).trim().toLowerCase();
    var inSchool = String(p.school || '').trim().toLowerCase();

    for(var i=1;i<d.length;i++){
      var r = d[i];
      var rowUser   = String(r[ACC.USERNAME]||'').trim().toLowerCase();
      var rowSchool = String(r[ACC.SCHOOL]||'').trim().toLowerCase();
      if(rowUser !== inUser) continue;
      if(inSchool && rowSchool !== inSchool) continue;
      return {success:true, data:{account: rowToAccount(r)}};
    }
    return {success:true, data:{account:null}};
  }catch(e){
    return {success:false, message:e.message};
  }
}

/* ---- updateTeacherProfile ---- */
function updateTeacherProfile(p){
  if(!p.username || !p.updates) return {success:false, message:'Missing fields'};
  var u = safeParse(p.updates);
  if(!u) return {success:false, message:'Invalid updates JSON'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:false, message:'No accounts'};

    var inUser   = String(p.username).trim().toLowerCase();
    var inSchool = String(p.school || '').trim().toLowerCase();

    for(var i=1;i<d.length;i++){
      var r = d[i];
      if(String(r[ACC.USERNAME]||'').trim().toLowerCase() !== inUser) continue;
      if(inSchool && String(r[ACC.SCHOOL]||'').trim().toLowerCase() !== inSchool) continue;

      if(u.phone          !== undefined) sh.getRange(i+1, ACC.PHONE+1).setValue(u.phone);
      if(u.email          !== undefined) sh.getRange(i+1, ACC.EMAIL+1).setValue(u.email);
      if(u.qualifications !== undefined) sh.getRange(i+1, ACC.QUALIFICATIONS+1).setValue(u.qualifications);
      sh.getRange(i+1, ACC.UPDATED_AT+1).setValue(new Date().toISOString());
      return {success:true};
    }
    return {success:false, message:'Teacher not found'};
  }catch(e){
    return {success:false, message:e.message};
  }
}

/* ---- deleteAccount ---- */
function deleteAccount(p){
  if(!p.username) return {success:false, message:'username required'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:false, message:'No accounts'};

    var inUser   = String(p.username).trim().toLowerCase();
    var inSchool = String(p.school || '').trim().toLowerCase();

    for(var i=d.length-1;i>=1;i--){
      var r = d[i];
      if(String(r[ACC.USERNAME]||'').trim().toLowerCase() !== inUser) continue;
      if(inSchool && String(r[ACC.SCHOOL]||'').trim().toLowerCase() !== inSchool) continue;
      sh.deleteRow(i+1);
      return {success:true};
    }
    return {success:false, message:'Account not found'};
  }catch(e){
    return {success:false, message:e.message};
  }
}

/* ---- getParentChildren ---- */
function getParentChildren(p){
  if(!p.school || !p.username) return {success:false, message:'Missing fields'};
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:true, data:{children:[]}};

    var inUser   = String(p.username).trim().toLowerCase();
    var inSchool = String(p.school).trim().toLowerCase();
    var childId  = '';
    for(var i=1;i<d.length;i++){
      var r = d[i];
      if(String(r[ACC.USERNAME]||'').trim().toLowerCase() === inUser &&
         String(r[ACC.SCHOOL]||'').trim().toLowerCase() === inSchool){
        childId = String(r[ACC.CHILD_ID]||'');
        break;
      }
    }
    if(!childId) return {success:true, data:{children:[]}};

    /* Look up student info from class sheets */
    var children = [];
    var links = getClassLinks({school:p.school}).data.links || [];
    for(var j=0;j<links.length;j++){
      try{
        var ss = openSS(links[j].sheetId);
        var studSh = ss.getSheetByName('Students');
        if(!studSh || studSh.getLastRow()<2) continue;
        var sd = studSh.getDataRange().getValues();
        var hdr = sd[0].map(function(x){ return String(x).trim(); });
        var iSid = hdr.indexOf('Student ID');
        var iName = hdr.indexOf('Student Name');
        for(var k=1;k<sd.length;k++){
          if(String(sd[k][iSid]) === childId){
            children.push({
              studentId: childId,
              studentName: sd[k][iName] || '',
              class: links[j].className
            });
            break;
          }
        }
        if(children.length) break;
      }catch(e){}
    }
    return {success:true, data:{children:children}};
  }catch(e){
    return {success:false, message:e.message};
  }
}

function getChatUsers(p){
  try{
    var sh = accountsSheet(p);
    enforceAccountsHeader(sh);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:true, data:{users:[]}};
    var us = [];
    for(var i=1;i<d.length;i++){
      var r = d[i];
      if(p.school && String(r[ACC.SCHOOL]||'').toLowerCase() !== String(p.school).toLowerCase()) continue;
      us.push({

        role:     String(r[ACC.ROLE]||'')
      });
    }
    return {success:true, data:{users:us}};
  }catch(e){
    return {success:false, message:e.message};
  }
}

/* ---------------- CLASS LINKS ---------------- */
function saveClassLink(p){
  if(!p.school || !p.className || !p.sheetId)
    return {success:false, message:'Missing fields'};
  var sh = masterSheet(SHEETS.CLASS_LINKS);
  var hdr = ['School','Class','Sheet ID','Updated At'];
  ensureHdr(sh, hdr);
  var d = sh.getDataRange().getValues();
  for(var i=1;i<d.length;i++){
    if(String(d[i][0]) === String(p.school) && String(d[i][1]) === String(p.className)){
      sh.getRange(i+1,3).setValue(p.sheetId);
      sh.getRange(i+1,4).setValue(new Date().toISOString());
      return {success:true};
    }
  }
  appendObj(sh, hdr, {
    'School':p.school, 'Class':p.className,
    'Sheet ID':p.sheetId, 'Updated At':new Date().toISOString()
  });
  return {success:true};
}
function getClassLinks(p){
  var sh = masterSheet(SHEETS.CLASS_LINKS);
  var d = sh.getDataRange().getValues();
  if(d.length < 2) return {success:true, data:{links:[]}};
  var h = d[0].map(function(x){ return String(x).trim(); });
  var links = [];
  for(var i=1;i<d.length;i++){
    var r = {};
    for(var j=0;j<h.length;j++) r[h[j]] = d[i][j];
    if(p.school && String(r['School']) !== String(p.school)) continue;
    links.push({className: r['Class'], sheetId: r['Sheet ID']});
  }
  return {success:true, data:{links:links}};
}

/* ---------------- STUDENTS ---------------- */
function getStudentCount(p){
  if(!p.school) return {success:false, message:'school required'};
  try{
    var links = getClassLinks({school:p.school}).data.links;
    var total = 0;
    links.forEach(function(l){
      try{
        var ss = openSS(l.sheetId);
        var sh = ss.getSheetByName('Students');
        if(sh && sh.getLastRow() > 1) total += (sh.getLastRow() - 1);
      }catch(e){}
    });
    return {success:true, data:{count:total}};
  }catch(e){ return {success:false, message:e.message}; }
}
function getStudents(p){
  if(!p.sheetId) return {success:false, message:'sheetId required'};
  var cn = p.className || '';
  try{
    var ss = openSS(p.sheetId);
    var sh = ss.getSheetByName('Students');
    if(!sh) return {success:true, data:{students:[], className:cn}};
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:true, data:{students:[], className:cn}};
    var h = d[0].map(function(x){ return String(x).trim(); });
    var list = [];
    for(var i=1;i<d.length;i++){
      var r = d[i], s = {};
      for(var j=0;j<h.length;j++) s[h[j]] = r[j];
      var sid = s['Student ID'] || s['studentId'] || r[0];
      var sn  = s['Student Name'] || s['studentName'] || r[1];
      if(!sid) continue;
      list.push({
        studentId:String(sid), studentName:String(sn||''),
        parentName:s['Parent Name']||'', parentPhone:s['Parent Phone']||'',
        parentEmail:s['Parent Email']||'', sex:s['Sex']||'',
        stream:s['Stream']||'', residence:s['Residence']||'',
        term:s['Term']||'', year:s['Year']||'', class:cn
      });
    }
    return {success:true, data:{students:list, className:cn}};
  }catch(e){ return {success:false, message:e.message}; }
}
function registerStudent(p){
  if(!p.sheetId || !p.studentId || !p.studentName)
    return {success:false, message:'Missing required fields'};
  try{
    var ss = openSS(p.sheetId);
    var sh = ss.getSheetByName('Students');
    var hdr = ['Student ID','Student Name','Parent Name','Parent Phone',
               'Parent Email','Sex','Stream','Residence','Term','Year','Registered At'];
    if(!sh){ sh = ss.insertSheet('Students'); sh.appendRow(hdr); }
    else   { ensureHdr(sh, hdr); }
    var d = sh.getDataRange().getValues();
    for(var i=1;i<d.length;i++){
      if(String(d[i][0]) === String(p.studentId))
        return {success:false, message:'Student ID already exists'};
    }
    appendObj(sh, hdr, {

function subjectTabName(subject){
  return String(subject).replace(/[\\\/\?\*\[\]:]/g,'_').substring(0,100).trim();
}
function getOrCreateOLevelTab(ss, subject){
  var name = subjectTabName(subject);
  var tab = ss.getSheetByName(name);
  var hdr = ['ID','Name','AOI','EOT','Initial'];
  var bg = '#c1121f';
  if(!tab || tab.getLastRow() === 0){
    if(!tab) tab = ss.insertSheet(name);
    tab.appendRow(hdr);
    tab.getRange(1,1,1,hdr.length).setFontWeight('bold').setBackground(bg).setFontColor('#ffffff');
    tab.setFrozenRows(1);
    return tab;
  }
  var cur = tab.getRange(1,1,1,Math.max(tab.getLastColumn(),1)).getValues()[0]
              .map(function(x){ return String(x).trim(); });
  var add = []; hdr.forEach(function(h){ if(cur.indexOf(h)<0) add.push(h); });
  if(add.length){
    var c = tab.getLastColumn()+1;
    add.forEach(function(h,i){
      tab.getRange(1,c+i).setValue(h).setFontWeight('bold').setBackground(bg).setFontColor('#ffffff');
    });
  }
  return tab;
}
function getOrCreateALevelTab(ss, subject){

  var bg = '#1a3b5c';

    tab.setFrozenRows(1);
    return tab;
  }
  var cur = tab.getRange(1,1,1,Math.max(tab.getLastColumn(),1)).getValues()[0]
              .map(function(x){ return String(x).trim(); });
  var add = []; hdr.forEach(function(h){ if(cur.indexOf(h)<0) add.push(h); });
  if(add.length){
    var c = tab.getLastColumn()+1;
    add.forEach(function(h,i){
      tab.getRange(1,c+i).setValue(h).setFontWeight('bold').setBackground(bg).setFontColor('#ffffff');
    });
  }
  return tab;
}
function postScoresOnly(p){
  if(!p.sheetId)  return {success:false, message:'Missing sheetId'};
  if(!p.subject)  return {success:false, message:'Missing subject'};
  if(!p.scores)   return {success:false, message:'Missing scores'};
  var level = (p.level || 'olevel').toLowerCase();
  var arr = safeParse(p.scores);
  if(!Array.isArray(arr) || arr.length === 0)
    return {success:false, message:'Scores array is empty'};
  try{
    var ss = openSS(p.sheetId);
    var tab = (level === 'alevel')
      ? getOrCreateALevelTab(ss, p.subject)
      : getOrCreateOLevelTab(ss, p.subject);
    var hdr = tab.getRange(1,1,1,Math.max(tab.getLastColumn(),1)).getValues()[0]
                .map(function(h){ return String(h).trim(); });
    var added = 0, updated = 0;

    arr.forEach(function(e){
      var sid = e.studentId;
      if(!sid) return;
      var d = tab.getDataRange().getValues();
      var ri = -1;
      for(var i=1;i<d.length;i++){
        if(String(d[i][0]) === String(sid)){ ri = i+1; break; }
      }
      var upd = { 'ID': sid, 'Name': e.studentName || '' };
      if(e.teacherInitials) upd['Initial'] = String(e.teacherInitials).toUpperCase();
      if(level === 'alevel'){
        if(e.paper1 !== undefined && e.paper1 !== null && e.paper1 !== '') upd['Paper 1'] = e.paper1;
        if(e.paper2 !== undefined && e.paper2 !== null && e.paper2 !== '') upd['Paper 2'] = e.paper2;
      }else{
        if(e.aoi !== undefined && e.aoi !== null && e.aoi !== '') upd['AOI'] = e.aoi;
        if(e.eot !== undefined && e.eot !== null && e.eot !== '') upd['EOT'] = e.eot;
      }
      if(ri > 0){
        for(var k in upd){
          var ci = hdr.indexOf(k);
          if(ci >= 0) tab.getRange(ri, ci+1).setValue(upd[k]);
        }
        updated++;
      }else{
        var row = hdr.map(function(h){ return upd[h] !== undefined ? upd[h] : ''; });
        tab.appendRow(row);
        added++;
      }
    });
    return {success:true, data:{
      added:added, updated:updated, total:arr.length,
      tabName: tab.getName(), headers:hdr
    }};
  }catch(e){ return {success:false, message:'postScoresOnly error: ' + e.message}; }
}

function getAllData(p){
  if(!p.sheetId) return {success:false, message:'sheetId required'};
  var cn = p.className || '';
  try{
    var ss = openSS(p.sheetId);
    var students = [];
    var stSh = ss.getSheetByName('Students');
    if(stSh && stSh.getLastRow() > 1){
      var sd = stSh.getDataRange().getValues();
      var sh = sd[0].map(function(x){ return String(x).trim(); });
      for(var i=1;i<sd.length;i++){
        var r = sd[i], s = {};
        for(var j=0;j<sh.length;j++) s[sh[j]] = r[j];
        var sid = s['Student ID'] || s['studentId'] || r[0];
        var sn  = s['Student Name'] || s['studentName'] || r[1];
        if(!sid) continue;
        students.push({
          studentId:String(sid), studentName:String(sn||''),
          parentName:s['Parent Name']||'', parentPhone:s['Parent Phone']||'',
          parentEmail:s['Parent Email']||'', sex:s['Sex']||'',
          stream:s['Stream']||'', residence:s['Residence']||'',
          term:s['Term']||'', year:s['Year']||'', class:cn, scores:{}
        });
      }
    }
    var skip = ['Students','Attendance','AttendanceMaster'];
    var tabsRead = [];
    ss.getSheets().forEach(function(tab){
      var nm = tab.getName();
      if(skip.indexOf(nm) >= 0) return;
      if(tab.getLastRow() < 2){ tabsRead.push({tab:nm, rows:0}); return; }
      var hdr = tab.getRange(1,1,1,tab.getLastColumn()).getValues()[0]
                  .map(function(h){ return String(h).trim(); });
      var isO = (hdr.indexOf('AOI') >= 0) || (hdr.indexOf('EOT') >= 0);
      var isA = (hdr.indexOf('Paper 1') >= 0) || (hdr.indexOf('Paper 2') >= 0);
      if(!isO && !isA){ tabsRead.push({tab:nm, skipped:'no subject headers'}); return; }
      var data = tab.getDataRange().getValues();
      var matched = 0;
      for(var i=1;i<data.length;i++){
        var row = data[i], rec = {};
        for(var j=0;j<hdr.length;j++) rec[hdr[j]] = row[j];
        var sid = String(rec['ID'] || rec['Student ID'] || rec['id'] || row[0] || '');
        if(!sid) continue;
        var student = null;
        for(var k=0;k<students.length;k++){
          if(String(students[k].studentId) === String(sid)){ student = students[k]; break; }
        }
        if(!student) continue;
        var entry = {};
        if(isA){
          entry.paper1 = parseFloat(rec['Paper 1'])||0;
          entry.paper2 = parseFloat(rec['Paper 2'])||0;
        }else{
          entry.aoi = parseFloat(rec['AOI'])||0;
          entry.eot = parseFloat(rec['EOT'])||0;
        }
        entry.teacherInitials = String(rec['Initial'] || '').toUpperCase();
        student.scores[nm] = entry;
        matched++;
      }
      tabsRead.push({tab:nm, rows:data.length-1, matched:matched, headers:hdr});
    });
    return {success:true, data:{
      sheetData:{students:students, className:cn, totalStudents:students.length},
      tabsRead:tabsRead
    }};
  }catch(e){ return {success:false, message:'getAllData error: ' + e.message}; }
}

      if(!days[sid]) days[sid] = {present:0,absent:0,late:0,leave:0,total:0};
      days[sid].total++;
      if(st === 'present')      days[sid].present++;
      else if(st === 'absent')  days[sid].absent++;
      else if(st === 'late')    days[sid].late++;
      else if(st === 'leave')   days[sid].leave++;
    }

      else if(st.indexOf('low') !== -1){ lowS++; }
      else { inS++; }
      var idx = items.indexOf(item);
      if(idx >= 0) usage[idx] += q;
    }
    return {success:true, data:{
      foodUsage:usage, foodLabels:items,
      inStock:inS, lowStock:lowS, outOfStock:outS, outOfStockItems:outI
    }};
  }catch(e){ return {success:false, message:e.message}; }
}
function saveStoreRecord(p){
  if(!p.record) return {success:false, message:'record required'};
  try{
    var r = safeParse(p.record);
    if(!r) return {success:false, message:'Invalid record JSON'};
    var sh = masterSheet(SHEETS.STORES);
    appendObj(sh,
      ['School','Item','Quantity','Unit','Status','Date','Time',
       'Recorded By','Timestamp'],
      {
        'School':p.school||'', 'Item':r.item||'', 'Quantity':r.quantity||0,
        'Unit':r.unit||'kg', 'Status':r.status||'in-stock',
        'Date':r.date||new Date().toISOString().split('T')[0],
        'Time':r.time||new Date().toLocaleTimeString(),
        'Recorded By':r.recordedBy||'', 'Timestamp':new Date().toISOString()
      });
    return {success:true};
  }catch(e){ return {success:false, message:e.message}; }
}

/* ---------------- SETTINGS ---------------- */
function getSchoolSettings(p){
  try{
    var sh = masterSheet(SHEETS.SETTINGS);
    var d = sh.getDataRange().getValues();
    if(d.length < 2) return {success:true, data:{settings:{}}};
    var h = d[0].map(function(x){ return String(x).trim(); });
    for(var i=1;i<d.length;i++){
      var r = {};
      for(var j=0;j<h.length;j++) r[h[j]] = d[i][j];
      if(String(r['School']) === String(p.school))
        return {success:true, data:{settings:r}};
    }
    return {success:true, data:{settings:{}}};
  }catch(e){ return {success:false, message:e.message}; }
}
function saveSchoolSettings(p){
  if(!p.school || !p.settings) return {success:false, message:'Missing fields'};
  try{
    var s = safeParse(p.settings);
    if(!s) return {success:false, message:'Invalid settings JSON'};
    var sh = masterSheet(SHEETS.SETTINGS);
    var hdr = ['School','School Name','Motto','Address','Phone','Email','Website',
               'Latitude','Longitude','Current Term','Current Year','Expected Fees',
               'Term Start','Term End','Next Term Start','Next Term End',
               'Finance Sheet','Attendance Sheet','Timetable Sheet',
               'Store Sheet','Nurse Sheet','Updated At'];
    ensureHdr(sh, hdr);
    var row = {
      'School':p.school, 'School Name':s.schoolName||'',
      'Motto':s.schoolMotto||'', 'Address':s.schoolAddress||'',
      'Phone':s.schoolPhone||'', 'Email':s.schoolEmail||'',
      'Website':s.schoolWebsite||'', 'Latitude':s.latitude||'',
      'Longitude':s.longitude||'', 'Current Term':s.currentTerm||'',
      'Current Year':s.currentYear||'',
      'Expected Fees':s.expectedFeesThisTerm||'',
      'Term Start':s.termStartDate||'', 'Term End':s.termEndDate||'',
      'Next Term Start':s.nextTermStart||'', 'Next Term End':s.nextTermEnd||'',
      'Finance Sheet':s.financeSheet||'', 'Attendance Sheet':s.attendanceSheet||'',
      'Timetable Sheet':s.timetableSheet||'',
      'Store Sheet':s.storeSheet||'', 'Nurse Sheet':s.nurseSheet||'',
      'Updated At':new Date().toISOString()
    };
    var d = sh.getDataRange().getValues();
    var hh = d[0].map(function(x){ return String(x).trim(); });
    var iSchool = hh.indexOf('School');
    for(var i=1;i<d.length;i++){
      if(String(d[i][iSchool]) === String(p.school)){
        for(var k in row){
          var ci = hh.indexOf(k);
          if(ci >= 0) sh.getRange(i+1,ci+1).setValue(row[k]);
        }
        return {success:true};
      }
    }
    appendObj(sh, hdr, row);
    return {success:true};
  }catch(e){ return {success:false, message:e.message}; }

}
