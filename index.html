<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📚 EduTrack Pro — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:35px 30px;box-shadow:0 25px 70px rgba(0,0,0,0.45);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#000 0%,#000 33%,#fcdc04 33%,#fcdc04 66%,#d90000 66%,#d90000 100%)}
.auth-card h1{font-family:Georgia,serif;color:#302b63;margin:5px 0}
.auth-role-toggle{display:flex;gap:6px;background:#f4f6fb;padding:6px;border-radius:12px;margin-bottom:20px;flex-wrap:wrap}
.auth-role-btn{flex:1;padding:10px 4px;border:none;border-radius:8px;background:none;font-weight:600;font-size:11px;color:#888;cursor:pointer;transition:.2s;min-width:60px}
.auth-role-btn.active{background:linear-gradient(135deg,#0f0c29,#302b63);color:#fff;box-shadow:0 4px 12px rgba(48,43,99,.35)}
.auth-role-btn:hover:not(.active){background:#e4e9f7}
.auth-mode-toggle{text-align:center;margin-bottom:18px;font-size:13px}
.auth-mode-link{background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#888;padding:4px 8px}
.auth-mode-link.active{color:#302b63;text-decoration:underline}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;color:#555;font-size:13px;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;background:#fafafa;transition:.3s}
.form-group input:focus,.form-group select:focus{border-color:#302b63;outline:none;box-shadow:0 0 0 3px rgba(48,43,99,.15);background:white}
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.btn-primary{background:linear-gradient(135deg,#0f0c29,#302b63);color:white;width:100%}
.btn-success{background:linear-gradient(135deg,#1a8a4a,#2d6a4f);color:white;width:100%}
.status-message{padding:12px 15px;border-radius:10px;margin-top:12px;font-size:14px;display:none}
.status-message.success{display:block;background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.status-message.error{display:block;background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.status-message.info{display:block;background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb}
.status-message.warning{display:block;background:#fff3cd;color:#856404;border:1px solid #ffeeba}
.connection-status{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.connection-status.connected{background:#d4edda;color:#155724}
.connection-status.disconnected{background:#f8d7da;color:#721c24}
.connection-status.checking{background:#fff3cd;color:#856404}
.connection-status .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#666}
.connection-status.connected .dot{background:#2d6a4f}
.connection-status.disconnected .dot{background:#c1121f}
.connection-status.checking .dot{background:#e85d04;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
hr{border:1px dashed #ddd;margin:15px 0}
.toast-notification{position:fixed;top:20px;right:20px;padding:16px 24px;border-radius:12px;color:white;font-weight:600;z-index:9999;opacity:0;transform:translateX(100%);transition:all .5s;max-width:400px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast-notification.show{opacity:1;transform:translateX(0)}
.toast-notification.success{background:linear-gradient(135deg,#1a8a4a,#2d6a4f)}
.toast-notification.error{background:linear-gradient(135deg,#c1121f,#780000)}
.toast-notification.info{background:linear-gradient(135deg,#0f0c29,#302b63)}
.toast-notification.warning{background:linear-gradient(135deg,#e85d04,#dc2f02)}
</style>
</head>
<body>

<div id="toastContainer"></div>

<div class="auth-card">
    <div style="text-align:center;margin-bottom:10px;">
        <span style="font-size:44px;">📚</span>
        <h1>EduTrack Pro</h1>
        <p style="color:#888;font-size:13px;" id="authSubtitle">Please sign in to continue</p>
        <div style="margin-top:8px;">
            <span id="connectionStatus" class="connection-status checking"><span class="dot"></span> Checking connection...</span>
        </div>
    </div>

    <div class="auth-role-toggle">
        <button type="button" class="auth-role-btn active" id="roleBtnAdmin" onclick="setRole('admin')">👨‍💼 Admin</button>
        <button type="button" class="auth-role-btn" id="roleBtnBursar" onclick="setRole('bursar')">💰 Bursar</button>
        <button type="button" class="auth-role-btn" id="roleBtnGate" onclick="setRole('gateman')">🚪 Gate</button>
        <button type="button" class="auth-role-btn" id="roleBtnTeacher" onclick="setRole('teacher')">👩‍🏫 Teacher</button>
        <button type="button" class="auth-role-btn" id="roleBtnNurse" onclick="setRole('nurse')">🩺 Nurse</button>
        <button type="button" class="auth-role-btn" id="roleBtnStore" onclick="setRole('store')">📦 Store</button>
        <button type="button" class="auth-role-btn" id="roleBtnParent" onclick="setRole('parent')">👨‍👩‍👦 Parent</button>
    </div>

    <div class="auth-mode-toggle" id="authModeToggle">
        <button type="button" class="auth-mode-link active" id="modeBtnLogin" onclick="setMode('login')">Login</button>
        <span style="color:#ccc;">|</span>
        <button type="button" class="auth-mode-link" id="modeBtnSignup" onclick="setMode('signup')">Create School Account</button>
    </div>

    <div id="loginFields">
        <div class="form-group"><label>Username</label><input type="text" id="authUsername" placeholder="Enter your username" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="authPassword" placeholder="Enter your password" /></div>
        <div class="form-group" id="schoolGroup"><label>School</label>
            <select id="authSchoolSelect"><option value="">Select your school</option></select>
        </div>
        <div class="form-group" id="childGroup" style="display:none;"><label>Select Child</label>
            <select id="authChildSelect"><option value="">Select your child</option></select>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-bottom:12px;">
            <input type="checkbox" id="authRemember" /> Remember me
        </label>
        <button class="btn btn-primary" id="loginBtn" onclick="attemptLogin()">🔓 Login</button>
        <p style="text-align:center;font-size:12px;color:#888;margin-top:12px;">Contact admin for your login credentials.</p>
    </div>

    <div id="signupFields" style="display:none;">
        <div class="form-group"><label>Full Name *</label><input type="text" id="signupName" /></div>
        <div class="form-group"><label>Username *</label><input type="text" id="signupUsername" /></div>
        <div class="form-group"><label>Password *</label><input type="password" id="signupPassword" /></div>
        <div class="form-group"><label>Confirm Password *</label><input type="password" id="signupPasswordConfirm" /></div>
        <hr>
        <p style="color:#302b63;font-weight:600;font-size:14px;margin-bottom:10px;">🏫 School Details</p>
        <div class="form-group"><label>School Name *</label><input type="text" id="signupSchoolName" /></div>
        <div class="form-row">
            <div class="form-group"><label>Phone *</label><input type="text" id="signupSchoolPhone" /></div>
            <div class="form-group"><label>Email *</label><input type="email" id="signupSchoolEmail" /></div>
        </div>
        <div class="form-group"><label>Address</label><input type="text" id="signupSchoolAddress" /></div>
        <div class="form-group"><label>Motto</label><input type="text" id="signupSchoolMotto" /></div>
        <button class="btn btn-success" id="signupBtn" onclick="attemptSignup()">✅ Create School Account</button>
    </div>

    <div id="authStatus" class="status-message"></div>
</div>

<script>
// ============================================================
// CONFIG — UPDATE THESE TWO VALUES
// ============================================================
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxodIXTSyZlzdl8Uropf30mqXC_Ea4XaKlpbtvdrhF5VxEtTeeUj4lz7tkbsWex3XWIw/exec';
var ACCOUNTS_SHEET_ID = '1OmV8zDm_KfwdHs3KQcvdpeIiJimLUa3KxltXcPcZjaQ';

var ROLE_HOME = {
    admin:   'admin.html',
    teacher: 'teacher.html',
    parent:  'parent.html',
    bursar:  'bursar.html',
    gateman: 'gate.html',
    nurse:   'nurse.html',
    store:   'store.html'
};

var pendingRole = 'admin';
var pendingMode = 'login';
var isConnected = false;

// ============================================================
// HELPERS
// ============================================================
function showToast(msg, type) {
    type = type || 'info';
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast-notification ' + type;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function () { t.classList.add('show'); }, 100);
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 500); }, 4000);
}

function showStatus(msg, type) {
    var el = document.getElementById('authStatus');
    if (!msg) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.className = 'status-message ' + (type || 'info');
    el.textContent = msg;
}

async function api(params) {
    var parts = [];
    for (var k in params) {
        if (params.hasOwnProperty(k) && params[k] !== undefined && params[k] !== null) {
            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
        }
    }
    var res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
        body: parts.join('&'),
        signal: AbortSignal.timeout(30000)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
}

// ============================================================
// ROLE / MODE
// ============================================================
function setRole(role) {
    pendingRole = role;
    document.querySelectorAll('.auth-role-btn').forEach(function (el) { el.classList.remove('active'); });
    var btn = document.getElementById('roleBtn' + (role === 'gateman' ? 'Gate' : role.charAt(0).toUpperCase() + role.slice(1)));
    if (btn) btn.classList.add('active');
    document.getElementById('authModeToggle').style.display = (role === 'admin') ? 'block' : 'none';
    document.getElementById('childGroup').style.display = (role === 'parent') ? 'block' : 'none';
    if (role === 'parent') loadParentChildren();
    if (role === 'admin') loadSchools();
}

function setMode(mode) {
    pendingMode = mode;
    document.getElementById('modeBtnLogin').classList.toggle('active', mode === 'login');
    document.getElementById('modeBtnSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('loginFields').style.display = (mode === 'login') ? 'block' : 'none';
    document.getElementById('signupFields').style.display = (mode === 'signup') ? 'block' : 'none';
    document.getElementById('authStatus').style.display = 'none';
}

// ============================================================
// CONNECTION
// ============================================================
async function testConnection() {
    var s = document.getElementById('connectionStatus');
    s.className = 'connection-status checking';
    s.innerHTML = '<span class="dot"></span> Testing...';
    try {
        var r = await api({ action: 'getSchools', sheetId: ACCOUNTS_SHEET_ID });
        if (r && r.success) {
            isConnected = true;
            s.className = 'connection-status connected';
            s.innerHTML = '<span class="dot"></span> Connected ✅';
            return true;
        } else {
            s.className = 'connection-status disconnected';
            s.innerHTML = '<span class="dot"></span> Error';
            return false;
        }
    } catch (e) {
        s.className = 'connection-status disconnected';
        s.innerHTML = '<span class="dot"></span> Offline';
        return false;
    }
}

async function loadSchools() {
    if (!isConnected) await testConnection();
    try {
        var r = await api({ action: 'getSchools', sheetId: ACCOUNTS_SHEET_ID });
        var select = document.getElementById('authSchoolSelect');
        if (select && r.success && r.data && r.data.schools) {
            select.innerHTML = '<option value="">Select your school</option>';
            r.data.schools.forEach(function (sc) {
                var o = document.createElement('option');
                o.value = sc; o.textContent = sc;
                select.appendChild(o);
            });
        }
    } catch (e) {}
}

async function loadParentChildren() {
    try {
        if (!isConnected) await testConnection();
        var username = document.getElementById('authUsername').value.trim();
        var school = document.getElementById('authSchoolSelect').value;
        if (!username || !school) return;
        var r = await api({
            action: 'getParentChildren', sheetId: ACCOUNTS_SHEET_ID,
            school: school, username: username
        });
        var select = document.getElementById('authChildSelect');
        if (select && r.success && r.data) {
            select.innerHTML = '<option value="">Select your child</option>';
            (r.data.children || []).forEach(function (c) {
                var o = document.createElement('option');
                o.value = c.studentId;
                o.textContent = c.studentName + ' (' + c.class + ')';
                select.appendChild(o);
            });
        }
    } catch (e) {}
}

// ============================================================
// LOGIN
// ============================================================
async function attemptLogin() {
    if (!isConnected) await testConnection();
    var username = document.getElementById('authUsername').value.trim();
    var password = document.getElementById('authPassword').value;
    var school = document.getElementById('authSchoolSelect').value;
    var childId = document.getElementById('authChildSelect').value;
    var remember = document.getElementById('authRemember').checked;

    if (!username || !password) { showStatus('Enter username and password.', 'error'); return; }
    if (!school) { showStatus('Select your school.', 'error'); return; }
    if (pendingRole === 'parent' && !childId) { showStatus('Select your child.', 'error'); return; }

    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '⏳ Signing in...';

    try {
        var r = await api({
            action: 'verifyLogin', sheetId: ACCOUNTS_SHEET_ID,
            role: pendingRole, username: username, password: password,
            school: school, childId: childId
        });
        btn.disabled = false; btn.textContent = '🔓 Login';

        if (r.success) {
            var session = r.data;
            session.school = school || session.school;
            session.childId = childId;
            if (pendingRole === 'parent') {
                if (Array.isArray(r.data.children)) session.children = r.data.children;
                else if (r.data.childId && r.data.childClass) session.children = [{ studentId: r.data.childId, studentName: r.data.childName || 'Your Child', class: r.data.childClass }];
                else session.children = [];
            }
            sessionStorage.setItem('edutrack_session', JSON.stringify(session));
            if (remember) localStorage.setItem('edutrack_session', JSON.stringify(session));

            showToast('✅ Welcome back!', 'success');
            var home = ROLE_HOME[session.role] || 'admin.html';
            setTimeout(function () { window.location.href = home; }, 400);
        } else {
            showStatus('❌ ' + (r.message || 'Invalid credentials.'), 'error');
        }
    } catch (e) {
        btn.disabled = false; btn.textContent = '🔓 Login';
        showStatus('⚠️ Server error: ' + e.message, 'warning');
    }
}

async function attemptSignup() {
    if (!isConnected) await testConnection();
    var name = document.getElementById('signupName').value.trim();
    var username = document.getElementById('signupUsername').value.trim();
    var password = document.getElementById('signupPassword').value;
    var confirm = document.getElementById('signupPasswordConfirm').value;
    var schoolName = document.getElementById('signupSchoolName').value.trim();
    var phone = document.getElementById('signupSchoolPhone').value.trim();
    var email = document.getElementById('signupSchoolEmail').value.trim();
    var address = document.getElementById('signupSchoolAddress').value.trim();
    var motto = document.getElementById('signupSchoolMotto').value.trim();

    if (!name || !username || !password || !schoolName || !phone || !email) { showStatus('Fill all required fields.', 'error'); return; }
    if (password.length < 6) { showStatus('Password must be 6+ characters.', 'error'); return; }
    if (password !== confirm) { showStatus('Passwords do not match.', 'error'); return; }

    var btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = '⏳ Creating...';

    try {
        var r = await api({
            action: 'signupAdmin', sheetId: ACCOUNTS_SHEET_ID,
            name: name, username: username, password: password,
            schoolName: schoolName, schoolPhone: phone, schoolEmail: email,
            schoolAddress: address, schoolMotto: motto
        });
        btn.disabled = false; btn.textContent = '✅ Create School Account';

        if (r.success) {
            var session = r.data;
            session.school = schoolName;
            sessionStorage.setItem('edutrack_session', JSON.stringify(session));
            showToast('✅ Account created!', 'success');
            setTimeout(function () { window.location.href = 'admin.html'; }, 500);
        } else showStatus('❌ ' + (r.message || 'Failed'), 'error');
    } catch (e) {
        btn.disabled = false; btn.textContent = '✅ Create School Account';
        showStatus('⚠️ ' + e.message, 'warning');
    }
}

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', function () {
    var existing = sessionStorage.getItem('edutrack_session') || localStorage.getItem('edutrack_session');
    if (existing) {
        try {
            var s = JSON.parse(existing);
            if (s && s.role) {
                window.location.href = ROLE_HOME[s.role] || 'admin.html';
                return;
            }
        } catch (e) {}
    }
    setRole('admin');
    setMode('login');
    testConnection();
});
</script>
</body>
</html>
