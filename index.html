<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f0c29" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>📚 EduTrack Pro — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
  --primary:#302b63;--accent:#fcdc04;
  --surface:#fff;--surface-2:#f8f9fa;--surface-3:#f0f4ff;
  --text:#1a1a2e;--text-2:#555;--text-3:#888;--border:#e0e0e0;
  --success:#1a8a4a;--danger:#c1121f;--warning:#e85d04;--info:#004085;
  --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --shadow-md:0 4px 15px rgba(0,0,0,.08);
  --shadow-lg:0 10px 30px rgba(0,0,0,.15);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  min-height:100vh;padding:14px;display:flex;align-items:center;justify-content:center;color:var(--text)
}
@media(min-width:640px){body{padding:24px}}

.auth-wrapper{width:100%;max-width:560px;position:relative}
.auth-card{
  background:rgba(255,255,255,.98);border-radius:var(--radius-lg);
  padding:24px 20px 28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden
}
@media(min-width:640px){.auth-card{padding:30px 30px 34px}}
.auth-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#000 0%,#000 33%,var(--accent) 33%,var(--accent) 66%,#d90000 66%,#d90000 100%)
}

.auth-header{text-align:center;margin-bottom:18px}
.auth-header .logo{font-size:50px;line-height:1;display:block;margin-bottom:6px}
.auth-header h1{
  font-family:Georgia,serif;color:var(--primary);font-size:26px;font-weight:700;margin-bottom:3px;
  background:linear-gradient(135deg,var(--bg1),var(--primary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.auth-header .subtitle{color:var(--text-3);font-size:13px}
.conn-status{
  display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;
  font-size:11px;font-weight:700;margin-top:10px
}
.conn-status .dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block;flex-shrink:0}
.conn-status.checking{background:#fff3cd;color:#856404}
.conn-status.checking .dot{background:var(--warning);animation:pulse 1s infinite}
.conn-status.connected{background:#d4edda;color:#155724}
.conn-status.connected .dot{background:var(--success)}
.conn-status.disconnected{background:#f8d7da;color:#721c24}
.conn-status.disconnected .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.role-toggle{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;background:var(--surface-2);padding:5px;border-radius:12px;
  margin-bottom:16px
}
@media(max-width:420px){.role-toggle{grid-template-columns:repeat(2,1fr)}}
.role-btn{
  padding:10px 6px;border:none;border-radius:8px;background:none;
  font-weight:700;font-size:11px;color:#666;cursor:pointer;transition:.2s;
  white-space:nowrap;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  min-height:56px;justify-content:center
}
@media(min-width:640px){.role-btn{font-size:12px;min-height:60px}}
.role-btn .role-emoji{font-size:18px;line-height:1}
.role-btn.active{background:linear-gradient(135deg,var(--bg1),var(--primary));color:#fff;box-shadow:0 4px 12px rgba(48,43,99,.35)}
.role-btn:not(.active):hover{background:rgba(48,43,99,.08);color:var(--primary)}

.mode-toggle{text-align:center;margin-bottom:16px;font-size:13px}
.mode-link{
  background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;
  color:var(--text-3);padding:6px 10px;font-family:inherit
}
.mode-link.active{color:var(--primary);text-decoration:underline}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;color:var(--text-2);font-size:13px;margin-bottom:6px}
.form-group input,.form-group select{
  width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:10px;
  font-size:16px;background:#fafafa;transition:.2s;font-family:inherit;-webkit-appearance:none
}
.form-group input:focus,.form-group select:focus{
  border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(48,43,99,.15);background:#fff
}
.form-row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.form-row{grid-template-columns:1fr 1fr}}
.pass-wrap{position:relative}
.pass-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:#888;font-size:15px;cursor:pointer;padding:6px
}

.btn{
  padding:14px 24px;border:none;border-radius:10px;font-size:15px;font-weight:700;
  cursor:pointer;transition:.2s;font-family:inherit;min-height:50px;width:100%;
  display:inline-flex;align-items:center;justify-content:center;gap:8px
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--bg1),var(--primary));color:#fff}
.btn-success{background:linear-gradient(135deg,var(--success),#2d6a4f);color:#fff}
.btn-primary:hover:not(:disabled),.btn-success:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18)}

hr{border:none;border-top:1px dashed var(--border);margin:18px 0}

.status-msg{
  padding:12px 15px;border-radius:10px;margin-top:12px;font-size:13px;display:none;
  line-height:1.5;border-left:4px solid
}
.status-msg.success{display:block;background:#d4edda;color:#155724;border-color:var(--success)}
.status-msg.error{display:block;background:#f8d7da;color:#721c24;border-color:var(--danger)}
.status-msg.info{display:block;background:#d1ecf1;color:#0c5460;border-color:var(--info)}
.status-msg.warning{display:block;background:#fff3cd;color:#856404;border-color:var(--warning)}

.toast-notification{
  position:fixed;top:16px;right:16px;left:16px;padding:14px 18px;border-radius:12px;
  color:#fff;font-weight:600;z-index:9999;opacity:0;transform:translateY(-20px);
  transition:all .3s;font-size:14px;box-shadow:var(--shadow-lg);text-align:center;max-width:400px
}
@media(min-width:640px){.toast-notification{left:auto;transform:translateX(120%)}}
.toast-notification.show{opacity:1;transform:translateY(0)}
@media(min-width:640px){.toast-notification.show{transform:translateX(0)}}
.toast-notification.success{background:linear-gradient(135deg,var(--success),#2d6a4f)}
.toast-notification.error{background:linear-gradient(135deg,var(--danger),#780000)}
.toast-notification.info{background:linear-gradient(135deg,var(--bg1),var(--primary))}
.toast-notification.warning{background:linear-gradient(135deg,var(--warning),#dc2f02)}

.footer-note{text-align:center;font-size:11px;color:var(--text-3);margin-top:16px;line-height:1.6}
</style>
</head>
<body>

<div id="toastContainer"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo">📚</span>
      <h1>EduTrack Pro</h1>
      <p class="subtitle" id="authSubtitle">Please sign in to continue</p>
      <span id="connectionStatus" class="conn-status checking"><span class="dot"></span> Checking connection…</span>
    </div>

    <div class="role-toggle">
      <button type="button" class="role-btn active" id="roleBtnAdmin"       onclick="setAuthRole('admin')"><span class="role-emoji">👨‍💼</span>Admin</button>
      <button type="button" class="role-btn"        id="roleBtnBursar"      onclick="setAuthRole('bursar')"><span class="role-emoji">💰</span>Bursar</button>
      <button type="button" class="role-btn"        id="roleBtnGateman"     onclick="setAuthRole('gateman')"><span class="role-emoji">🚪</span>Gate</button>
      <button type="button" class="role-btn"        id="roleBtnTeacher"     onclick="setAuthRole('teacher')"><span class="role-emoji">👩‍🏫</span>Teacher</button>
      <button type="button" class="role-btn"        id="roleBtnParent"      onclick="setAuthRole('parent')"><span class="role-emoji">👨‍👩‍👦</span>Parent</button>
      <button type="button" class="role-btn"        id="roleBtnStudent"     onclick="setAuthRole('student')"><span class="role-emoji">🎓</span>Student</button>
      <button type="button" class="role-btn"        id="roleBtnNurse"       onclick="setAuthRole('nurse')"><span class="role-emoji">🏥</span>Nurse</button>
      <button type="button" class="role-btn"        id="roleBtnStorekeeper" onclick="setAuthRole('storekeeper')"><span class="role-emoji">📦</span>Store</button>
    </div>

    <div class="mode-toggle" id="authModeToggle">
      <button type="button" class="mode-link active" id="modeBtnLogin" onclick="setAuthMode('login')">Login</button>
      <span style="color:#ccc">|</span>
      <button type="button" class="mode-link" id="modeBtnSignup" onclick="setAuthMode('signup')">Create School Account</button>
    </div>

    <div id="loginFields">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="authUsername" placeholder="Enter your username" autocomplete="username"
          onchange="if(pendingAuthRole==='parent') loadParentChildren()"
          onblur="if(pendingAuthRole==='parent') loadParentChildren()" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pass-wrap">
          <input type="password" id="authPassword" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="pass-toggle" onclick="togglePassword('authPassword',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group" id="authSchoolGroup">
        <label>School</label>
        <select id="authSchoolSelect" onchange="if(pendingAuthRole==='parent') loadParentChildren()">
          <option value="">Select your school</option>
        </select>
      </div>
      <div class="form-group" id="authChildGroup" style="display:none">
        <label>Select Child</label>
        <select id="authChildSelect"><option value="">Select your child</option></select>
      </div>
      <button class="btn btn-primary" id="authLoginBtn" onclick="attemptLogin()">🔓 Login</button>
      <p class="footer-note">Contact admin for your login credentials.</p>
    </div>

    <div id="signupFields" style="display:none">
      <div class="form-group"><label>Full Name *</label><input type="text" id="signupName" autocomplete="name" /></div>
      <div class="form-group"><label>Username *</label><input type="text" id="signupUsername" autocomplete="username" /></div>
      <div class="form-group">
        <label>Password *</label>
        <div class="pass-wrap">
          <input type="password" id="signupPassword" autocomplete="new-password" />
          <button type="button" class="pass-toggle" onclick="togglePassword('signupPassword',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <div class="pass-wrap">
          <input type="password" id="signupPasswordConfirm" autocomplete="new-password" />
          <button type="button" class="pass-toggle" onclick="togglePassword('signupPasswordConfirm',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <hr>
      <p style="color:var(--primary);font-weight:700;font-size:14px;margin-bottom:12px">🏫 School Details</p>
      <div class="form-group"><label>School Name *</label><input type="text" id="signupSchoolName" /></div>
      <div class="form-row">
        <div class="form-group"><label>Phone *</label><input type="tel" id="signupSchoolPhone" /></div>
        <div class="form-group"><label>Email *</label><input type="email" id="signupSchoolEmail" /></div>
      </div>
      <div class="form-group"><label>Address</label><input type="text" id="signupSchoolAddress" /></div>
      <div class="form-group"><label>Motto</label><input type="text" id="signupSchoolMotto" /></div>
      <button class="btn btn-success" id="authSignupBtn" onclick="attemptAdminSignup()">✅ Create School Account</button>
    </div>

    <div id="authStatus" class="status-msg"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   EduTrack Pro — Login v3
   ═══════════════════════════════════════════════════════════════ */

var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8LoQcAlViMcFQLvvJYMdjZT00Ha8YHqeV91ibXFGB2BQnHrVgyU-0psvDdyhwUcrSKA/exec';
var ACCOUNTS_SHEET_ID = '1OmV8zDm_KfwdHs3KQcvdpeIiJimLUa3KxltXcPcZjaQ';

var ROLE_HOME = {
  admin:'admin.html', bursar:'bursar.html', gateman:'gate.html',
  teacher:'teacher.html', parent:'parent.html', student:'student.html',
  nurse:'nurse.html', storekeeper:'store.html'
};

var pendingAuthRole = 'admin';
var pendingAuthMode = 'login';
var isConnected = false;

/* ─── Toast / status ─── */
function showToast(msg, type){
  type = type || 'info';
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast-notification ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('show'); }, 30);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 400); }, 3600);
}
function showAuthStatus(msg, type){
  var el = document.getElementById('authStatus');
  el.style.display = 'block';
  el.className = 'status-msg ' + (type || 'info');
  el.textContent = msg;
}
function togglePassword(id, btn){
  var inp = document.getElementById(id);
  if(!inp) return;
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
}

/* ─── API helper ─── */
async function callAppsScript(params){
  var parts = [];
  for(var k in params){
    if(params.hasOwnProperty(k) && params[k] !== undefined && params[k] !== null){
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
  }
  var res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
    body: parts.join('&'),
    signal: AbortSignal.timeout(30000)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

/* ─── Role / mode toggles ─── */
function setAuthRole(role){
  pendingAuthRole = role;
  document.querySelectorAll('.role-btn').forEach(function(el){ el.classList.remove('active'); });
  var btn = document.getElementById('roleBtn' + role.charAt(0).toUpperCase() + role.slice(1));
  if(btn) btn.classList.add('active');
  var mode = document.getElementById('authModeToggle');
  var cg = document.getElementById('authChildGroup');
  if(mode) mode.style.display = (role === 'admin') ? 'block' : 'none';
  if(cg){
    cg.style.display = (role === 'parent') ? 'block' : 'none';
    if(role === 'parent') loadParentChildren();
  }
  setAuthMode(role !== 'admin' ? 'login' : pendingAuthMode);
  if(role === 'admin') loadSchoolsForLogin();
}
function setAuthMode(mode){
  pendingAuthMode = mode;
  document.getElementById('modeBtnLogin').classList.toggle('active', mode === 'login');
  document.getElementById('modeBtnSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('loginFields').style.display = (mode === 'login') ? 'block' : 'none';
  document.getElementById('signupFields').style.display = (mode === 'signup') ? 'block' : 'none';
  document.getElementById('authStatus').style.display = 'none';
  if(mode === 'login') loadSchoolsForLogin();
}

/* ─── Connection ─── */
async function testConnection(){
  var s = document.getElementById('connectionStatus');
  s.className = 'conn-status checking';
  s.innerHTML = '<span class="dot"></span> Testing…';
  try{
    var r = await callAppsScript({ action: 'ping' });
    if(r && r.success){
      isConnected = true;
      s.className = 'conn-status connected';
      s.innerHTML = '<span class="dot"></span> Connected';
      await loadSchoolsForLogin();
      return true;
    }
    s.className = 'conn-status disconnected';
    s.innerHTML = '<span class="dot"></span> Error';
    return false;
  } catch(e){
    console.error('Connection test failed:', e);
    isConnected = false;
    s.className = 'conn-status disconnected';
    s.innerHTML = '<span class="dot"></span> Offline';
    return false;
  }
}

async function loadSchoolsForLogin(){
  if(!isConnected){ var ok = await testConnection(); if(!ok) return; }
  try{
    var r = await callAppsScript({
      action: 'getAllAccounts',
      sheetId: ACCOUNTS_SHEET_ID,
      school: ''
    });
    var select = document.getElementById('authSchoolSelect');
    if(!select) return;
    select.innerHTML = '<option value="">Select your school</option>';
    if(r && r.success && r.data && Array.isArray(r.data.accounts)){
      var schools = [];
      r.data.accounts.forEach(function(a){
        var s = String(a.school || '').trim();
        if(s && schools.indexOf(s) === -1) schools.push(s);
      });
      schools.sort();
      schools.forEach(function(sc){
        var o = document.createElement('option');
        o.value = sc; o.textContent = sc;
        select.appendChild(o);
      });
    }
  } catch(e){ console.warn('loadSchoolsForLogin error:', e); }
}

async function loadParentChildren(){
  try{
    if(!isConnected){ var ok = await testConnection(); if(!ok) return; }
    var username = document.getElementById('authUsername')?.value?.trim() || '';
    var school = document.getElementById('authSchoolSelect')?.value || '';
    if(!username || !school) return;
    var r = await callAppsScript({
      action: 'getParentChildren',
      sheetId: ACCOUNTS_SHEET_ID,
      school: school, username: username
    });
    var select = document.getElementById('authChildSelect');
    if(select && r && r.success && r.data){
      select.innerHTML = '<option value="">Select your child</option>';
      (r.data.children || []).forEach(function(c){
        var o = document.createElement('option');
        o.value = c.studentId;
        o.textContent = c.studentName + ' (' + c.class + ')';
        select.appendChild(o);
      });
    }
  } catch(e){}
}

/* ─── Login ─── */
async function attemptLogin(){
  if(!isConnected) await testConnection();

  var username = document.getElementById('authUsername').value.trim();
  var password = document.getElementById('authPassword').value;
  var school = document.getElementById('authSchoolSelect').value;
  var childId = document.getElementById('authChildSelect').value;

  if(!username || !password){ showAuthStatus('Enter username and password.', 'error'); return; }
  if(!school){ showAuthStatus('Select a school.', 'error'); return; }
  if(pendingAuthRole === 'parent' && !childId){ showAuthStatus('Select your child.', 'error'); return; }

  var btn = document.getElementById('authLoginBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Signing in…';

  try{
    var r = await callAppsScript({
      action: 'login',
      sheetId: ACCOUNTS_SHEET_ID,
      username: username, password: password, school: school
    });
    btn.disabled = false; btn.innerHTML = '🔓 Login';

    if(r && r.success && r.data && r.data.user){
      var u = r.data.user;
      var backendRole = String(u.role || '').toLowerCase();
      if(backendRole && backendRole !== pendingAuthRole &&
         !(pendingAuthRole === 'admin' && backendRole === 'superadmin')){
        showAuthStatus(
          '❌ This account is registered as "' + backendRole +
          '", not "' + pendingAuthRole + '". Select the correct role.',
          'error'
        );
        return;
      }

      var session = u;
      session.school = school || session.school;
      if(pendingAuthRole === 'parent') session.childId = childId;
      sessionStorage.setItem('authSession', JSON.stringify(session));
      showToast('✅ Welcome back, ' + (u.name || u.username) + '!', 'success');

      var home = ROLE_HOME[backendRole || pendingAuthRole] || 'admin.html';
      setTimeout(function(){ window.location.replace(home); }, 400);
    } else {
      showAuthStatus('❌ ' + ((r && r.message) || 'Invalid username, password, or school.'), 'error');
    }
  } catch(e){
    btn.disabled = false; btn.innerHTML = '🔓 Login';
    showAuthStatus('⚠️ Server error: ' + e.message, 'warning');
  }
}

/* ─── Signup ─── */
async function attemptAdminSignup(){
  if(!isConnected) await testConnection();

  var name = document.getElementById('signupName').value.trim();
  var username = document.getElementById('signupUsername').value.trim();
  var password = document.getElementById('signupPassword').value;
  var confirm = document.getElementById('signupPasswordConfirm').value;
  var schoolName = document.getElementById('signupSchoolName').value.trim();
  var phone = document.getElementById('signupSchoolPhone').value.trim();
  var email = document.getElementById('signupSchoolEmail').value.trim();
  var address = document.getElementById('signupSchoolAddress').value.trim();
  var motto = document.getElementById('signupSchoolMotto').value.trim();

  if(!name || !username || password.length < 6 || password !== confirm || !schoolName || !phone || !email){
    showAuthStatus('Fill all required fields correctly (password ≥ 6 chars).', 'error'); return;
  }
  var btn = document.getElementById('authSignupBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Creating…';

  try{
    var r = await callAppsScript({
      action: 'createSchoolAccount',
      sheetId: ACCOUNTS_SHEET_ID,
      name: name, username: username, password: password,
      schoolName: schoolName, schoolPhone: phone, schoolEmail: email,
      schoolAddress: address, schoolMotto: motto
    });
    btn.disabled = false; btn.innerHTML = '✅ Create School Account';

    if(r && r.success){
      var session = (r.data && r.data.user) || {
        name: name, username: username, role: 'admin', school: schoolName
      };
      session.school = schoolName;
      sessionStorage.setItem('authSession', JSON.stringify(session));
      showToast('✅ School account created!', 'success');
      setTimeout(function(){ window.location.replace('admin.html'); }, 500);
    } else {
      showAuthStatus('❌ ' + ((r && r.message) || 'Signup failed.'), 'error');
    }
  } catch(e){
    btn.disabled = false; btn.innerHTML = '✅ Create School Account';
    showAuthStatus('⚠️ ' + e.message, 'warning');
  }
}

/* ═══════════════════════════════════════════════════════════════
   DOMContentLoaded — validate session, else ALWAYS show login
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function(){
  // If URL contains ?loggedout=… → always force logout state
  var urlParams = new URLSearchParams(window.location.search);
  if(urlParams.has('loggedout') || urlParams.has('fresh')){
    try{ sessionStorage.removeItem('authSession'); }catch(e){}
  }

  // Try to auto-restore a *validated* session
  try{
    var raw = sessionStorage.getItem('authSession');
    if(raw){
      var s = JSON.parse(raw);
      var role = String((s && s.role) || '').trim().toLowerCase();
      var home = ROLE_HOME[role];

      // A session is valid only if we know where to send the user
      // AND it has a username AND a recognised role
      if(home && s && s.username && role){
        window.location.replace(home);
        return;
      }

      // Invalid session → clear it
      console.warn('[login] Discarding invalid session:', s);
      sessionStorage.removeItem('authSession');
    }
  } catch(e){
    console.warn('[login] Session parse error:', e);
    try{ sessionStorage.removeItem('authSession'); }catch(_){}
  }

  // Show login form
  setAuthRole('admin');
  setAuthMode('login');
  setTimeout(testConnection, 400);
});
</script>
</body>
</html>
